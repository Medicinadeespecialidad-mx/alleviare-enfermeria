<style>
/* Layout: una columna, encabezado blanco con logo y pestañas finas; tarjetas suaves sobre crema; serif del logo para títulos, sans redondeada para leer */
:root{
  --bg:#FAF6F3; --surface:#FFFFFF; --sunk:#F4EEEA; --ink:#2B2942; --muted:#6F6C85; --line:#ECE4E6; --line-2:#E2D8DC;
  --accent:#5A5FA3; --accent-2:#7C81C2; --accent-ink:#FFFFFF; --accent-soft:#EFEFF9; --pink:#EBADCF; --pink-soft:#FCEFF6; --cream:#F5E4D7;
  --ok:#2C7656; --ok-soft:#E6F3EC; --warn:#946016; --warn-soft:#FBF0DC; --bad:#B03A33; --bad-soft:#FBE8E5;
  --c1:#5A5FA3; --c2:#2A7F92; --c3:#C1603A; --c4:#438F57; --c5:#C25690; --c6:#8E7425;
  --shadow:0 1px 2px rgba(60,40,80,.05),0 6px 20px rgba(60,40,80,.06);
  --f-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15141D; --surface:#1E1C29; --sunk:#191723; --ink:#EFEDF7; --muted:#A8A5BD; --line:#2F2C40; --line-2:#3A3650;
  --accent:#B6B9EA; --accent-2:#9A9FD0; --accent-ink:#1A1930; --accent-soft:#292842; --pink:#E7A3C8; --pink-soft:#352230; --cream:#3A2F29;
  --ok:#66C99A; --ok-soft:#173226; --warn:#E6B45F; --warn-soft:#382A12; --bad:#F2847A; --bad-soft:#3C1D1B;
  --c1:#B6B9EA; --c2:#5FC4D7; --c3:#F09368; --c4:#80CC90; --c5:#EE8ABB; --c6:#DABF66;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15141D; --surface:#1E1C29; --sunk:#191723; --ink:#EFEDF7; --muted:#A8A5BD; --line:#2F2C40; --line-2:#3A3650;
  --accent:#B6B9EA; --accent-2:#9A9FD0; --accent-ink:#1A1930; --accent-soft:#292842; --pink:#E7A3C8; --pink-soft:#352230; --cream:#3A2F29;
  --ok:#66C99A; --ok-soft:#173226; --warn:#E6B45F; --warn-soft:#382A12; --bad:#F2847A; --bad-soft:#3C1D1B;
  --c1:#B6B9EA; --c2:#5FC4D7; --c3:#F09368; --c4:#80CC90; --c5:#EE8ABB; --c6:#DABF66;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.15}
h1{font-family:var(--f-display);font-weight:600;font-size:2rem;letter-spacing:.005em}
h2{font-family:var(--f-display);font-weight:600;font-size:1.45rem}
h3{font-size:1rem;font-weight:700}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top::after{content:"";display:block;height:2px;background:linear-gradient(90deg,var(--pink),var(--accent-2) 60%,var(--cream))}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding-block:10px 0}
.brand img{height:40px;width:auto;max-width:100%;display:block}
.seg{order:3;width:100%;display:flex;gap:0;overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}.seg button[hidden]{display:none}
.seg button{border:0;background:none;cursor:pointer;color:var(--muted);font-weight:600;font-size:.76rem;padding:10px 5px 11px;flex:1 0 auto;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;letter-spacing:.01em}
.seg button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
@media (min-width:820px){.seg{order:0;width:auto;display:flex;gap:6px;align-self:stretch;overflow:visible}.seg button{padding:20px 12px 18px;font-size:.92rem;flex:none}}
.perms{display:grid;grid-template-columns:1fr 1fr;gap:8px}.perm{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:var(--surface)}.perm input{width:18px;height:18px;flex:none;margin:2px 0 0;accent-color:var(--accent)}.perm b{display:block;font-size:.9rem}.perm span{font-size:.75rem;color:var(--muted);line-height:1.3}.perm.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}.perm.off{opacity:.5;cursor:default}@media (max-width:420px){.perms{grid-template-columns:1fr}}
.who{margin-left:auto;font-size:.82rem;color:var(--muted);display:flex;gap:8px;align-items:center}
.who .av{width:30px;height:30px;border-radius:50%;background:var(--pink-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:.78rem;border:1px solid var(--line-2)}
.who b{color:var(--ink);font-weight:700}
main{padding-block:26px 90px}

/* estructura */
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0;box-shadow:var(--shadow)}
.card.flat{background:transparent;border-style:dashed;box-shadow:none}
.sec-t{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.num{font-variant-numeric:tabular-nums}
section[id]{scroll-margin-top:120px;padding-top:6px}
section[id] h2{display:flex;align-items:center;gap:10px}

/* formularios */
label.f{display:flex;flex-direction:column;gap:6px;font-size:.8rem;color:var(--muted);min-width:0}
label.f > span{font-weight:600;letter-spacing:.01em}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=tel],input[type=email],input[type=password],input[type=search],input:not([type]),select,textarea{
  background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:11px 13px;color:var(--ink);width:100%;min-width:0;font-size:1rem;transition:border-color .15s,box-shadow .15s}
input:hover,select:hover,textarea:hover{border-color:var(--accent-2)}
textarea{min-height:96px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:18px;height:18px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:10px 20px;border-radius:999px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-size:.93rem;letter-spacing:.01em;transition:transform .12s,box-shadow .15s,background .15s;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 28%,transparent)}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:none}
.btn.quiet{background:var(--surface);border-color:var(--line-2);color:var(--ink);box-shadow:none}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad);box-shadow:none}
.btn.sm{padding:6px 14px;font-size:.84rem}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:700;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 35%,transparent);text-underline-offset:3px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap;letter-spacing:.01em}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.lvl{position:relative;overflow:hidden}
.lvl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--muted)}
.lvl-basico::before{background:var(--c4)} .lvl-intermedio::before{background:var(--accent-2)} .lvl-alto::before{background:var(--bad)} .lvl-finvida::before{background:var(--pink)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.88rem;transition:background .12s,border-color .12s}
.chip:hover{border-color:var(--accent-2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.fieldgrid{display:grid;gap:14px 12px;grid-template-columns:repeat(auto-fill,minmax(145px,1fr))}
.fieldgrid .full{grid-column:1/-1}
details.mod{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
details.mod > summary{padding:16px 18px;cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.mod > summary::-webkit-details-marker{display:none}
details.mod > summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);flex:none;transition:transform .15s}
details.mod[open] > summary::after{transform:rotate(-135deg)}
details.mod > .in{padding:4px 18px 18px;border-top:1px solid var(--line)}
details.mod > .in > .stack > .sec-t,details.mod .in .sec-t{color:var(--accent);margin-top:6px}

/* listas y tablas */
.list{display:flex;flex-direction:column}
.list > .it{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.list > .it:last-child{border-bottom:0}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tbody tr:last-child td{border-bottom:0}
th{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;background:transparent;white-space:nowrap;border-bottom:1px solid var(--line-2)}
tr.click{cursor:pointer;transition:background .12s} tr.click:hover td{background:var(--pink-soft)}
.mar{border-collapse:separate;border-spacing:0;font-size:.75rem}
.mar th,.mar td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:5px 4px;text-align:center;min-width:26px}
.mar th{padding:8px 4px;letter-spacing:.04em}
.mar td.name{text-align:left;min-width:180px;white-space:normal;padding:8px 10px;position:sticky;left:0;background:var(--surface);z-index:1}
.mar td.a{background:var(--ok-soft);color:var(--ok);font-weight:700}
.mar td.o{background:var(--bad-soft);color:var(--bad);font-weight:700}
.mar td.m{background:var(--warn-soft);color:var(--warn);font-weight:700}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.kpi b{display:block;font-family:var(--f-display);font-weight:600;font-size:2.4rem;font-variant-numeric:lining-nums tabular-nums;line-height:1}
.kpi span{font-size:.8rem;color:var(--muted)}
.kpi.bad b{color:var(--bad)} .kpi.warn b{color:var(--warn)} .kpi.ok b{color:var(--ok)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line-2);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.empty{padding:32px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--r);background:color-mix(in srgb,var(--surface) 55%,transparent)}

/* modales y avisos */
.modal-bg{position:fixed;inset:0;background:rgba(30,20,40,.45);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:env(safe-area-inset-top,0px) 0 0}
.modal{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:24px max(18px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));box-shadow:0 -10px 40px rgba(30,20,40,.2)}
@media (min-width:700px){.modal-bg{align-items:center}.modal{border-radius:22px}}
.sig{width:100%;height:170px;background:#fff;border:1px dashed var(--accent-2);border-radius:12px;touch-action:none;display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;z-index:80;font-size:.9rem;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.chartbox{position:relative;height:230px}
.alert{padding:12px 14px;border-radius:12px;font-size:.9rem}
.alert.warn{background:var(--warn-soft);color:var(--warn)} .alert.bad{background:var(--bad-soft);color:var(--bad)} .alert.info{background:var(--accent-soft);color:var(--accent)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps a{display:inline-flex;gap:6px;align-items:center;font-size:.8rem;padding:5px 12px 5px 5px;border-radius:999px;background:var(--sunk);color:var(--muted);text-decoration:none;font-weight:600}
.steps a b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--surface);font-size:.72rem;font-variant-numeric:tabular-nums}
.steps a.done{background:var(--ok-soft);color:var(--ok)}
.steps a.done b{background:var(--ok);color:var(--surface)}
.hero-logo{display:flex;justify-content:center;padding-block:8px}
.hero-logo img{height:96px;width:auto}
.gate{max-width:440px;margin:4vh auto 0;text-align:center}
.gate .card{text-align:left}
.gate h1{font-size:2.2rem}
.hide-sm{display:none}
@media (min-width:520px){.hide-sm{display:inline}}
.tot{font-family:var(--f-display);font-size:2rem;font-weight:600;font-variant-numeric:lining-nums tabular-nums;color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.cl{padding:10px 0;border-bottom:1px solid var(--line)}.cl:last-child{border-bottom:0}.cl.off{opacity:.5}.cl.off .cl-h b:first-child{text-decoration:line-through}.cl-h{display:flex;justify-content:space-between;gap:12px;align-items:baseline}.cl-f{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-top:6px}.cl-f label{display:flex;flex-direction:column;font-size:.7rem;color:var(--muted);gap:2px}.cl-f label{flex:0 0 auto;align-items:flex-start}.cl-f .cell{width:100px!important;min-width:0;padding:6px 8px;font-size:.88rem}.cl-f select.cell{width:auto!important}select.cell{width:auto}.cl-a{margin-left:auto;padding-bottom:6px}.kmoney{font-size:1.5rem!important}.tot{gap:6px}.nb{display:inline-block;min-width:17px;padding:0 5px;border-radius:9px;background:#C0392B;color:#fff;font-size:.66rem;line-height:17px;text-align:center;font-weight:700;margin-left:2px}table.cot td{vertical-align:middle}

<script>
"use strict";
/* ============ utilidades ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => ymd(new Date());
const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const iso = () => new Date().toISOString();
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
const live = a => (a || []).filter(x => !x.anulado);
const fmtD = s => { if (!s) return "—"; const [y, m, d] = s.slice(0, 10).split("-"); return d + "/" + m + "/" + y; };
const fmtDT = s => { if (!s) return "—"; const d = new Date(s); return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear() + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const daysTo = s => { if (!s) return Infinity; const a = new Date(s + "T00:00:00"), b = new Date(today() + "T00:00:00"); return Math.round((a - b) / 864e5); };
const age = s => { if (!s) return ""; const b = new Date(s + "T00:00:00"), n = new Date(); let a = n.getFullYear() - b.getFullYear(); if (n.getMonth() < b.getMonth() || (n.getMonth() === b.getMonth() && n.getDate() < b.getDate())) a--; return a; };
const getPath = (o, p) => p.split(".").reduce((a, k) => a == null ? a : a[k], o);
const setPath = (o, p, v) => { const ks = p.split("."); let t = o; ks.slice(0, -1).forEach(k => { if (t[k] == null || typeof t[k] !== "object") t[k] = {}; t = t[k]; }); t[ks[ks.length - 1]] = v; };
const clone = o => JSON.parse(JSON.stringify(o));
function ss(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } }
let toastT;
function toast(msg) { let t = $(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); } t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }

/* ============ almacenamiento: compartido (db) o local ============ */
const COLS = ["patients", "shifts", "items", "moves", "config", "nurses", "ventas"];
const S = { patients: {}, shifts: {}, items: {}, moves: {}, config: {}, nurses: {}, ventas: {} };
const LKEY = "alleviare.v1.";
const Store = {
  db: null, mode: "local", pending: new Set(), loaded: false,
  loadLocal() { COLS.forEach(c => { try { S[c] = JSON.parse(localStorage.getItem(LKEY + c) || "{}"); } catch (e) { S[c] = {}; } }); },
  saveLocal(c) { try { localStorage.setItem(LKEY + c, JSON.stringify(S[c])); } catch (e) { toast("No se pudo guardar en este dispositivo"); } },
  async init() {
    if (SB.url && SB.key) return SB.init();
    this.loadLocal(); this.loaded = true; render();
    try {
      if (!window.claude || typeof window.claude.use !== "function") return;
      const db = await window.claude.use("db");
      if (!db) return;
      this.db = db; this.mode = "db"; this.loaded = false; COLS.forEach(c => S[c] = {}); render();
      let got = 0; const timer = setTimeout(() => { if (!this.loaded) { this.loaded = true; this.err = "La base compartida tarda en responder."; render(); } }, 10000);
      COLS.forEach(c => db.collection(c).onSnapshot(snap => {
        const m = {}; snap.docs.forEach(d => { m[d.id] = d.data(); });
        this.pending.forEach(k => { const [pc, id] = k.split("/"); if (pc === c && S[c][id]) m[id] = S[c][id]; });
        S[c] = m; got |= (1 << COLS.indexOf(c));
        if (got === (1 << COLS.length) - 1 && !this.loaded) { this.loaded = true; clearTimeout(timer); }
        scheduleRender();
      }, e => { this.loaded = true; clearTimeout(timer); this.err = "No se pudo leer la base compartida (" + (e.code || "") + ")."; render(); }));
    } catch (e) { /* sin capacidad: modo local */ }
  },
  put(c, o) {
    o.updatedAt = iso(); o.updatedBy = APP.user || "";
    S[c][o.id] = o;
    if (this.mode === "sb") { SB.put(c, o); return; }
    if (this.db) {
      const k = c + "/" + o.id; this.pending.add(k);
      this.db.collection(c).doc(o.id).set(JSON.parse(JSON.stringify(o)))
        .then(() => this.pending.delete(k))
        .catch(e => { this.pending.delete(k); toast(e && e.code === "not_granted" ? "Sin permiso para guardar: pide acceso de edición" : "No se guardó: " + (e && e.message || "error")); });
    } else this.saveLocal(c);
  },
  del(c, id) { delete S[c][id]; if (this.mode === "sb") { SB.del(c, id); return; } if (this.db) this.db.collection(c).doc(id).delete().catch(() => toast("No se pudo borrar")); else this.saveLocal(c); }
};
/* ============ servidor Supabase (versión GitHub) ============ */
const SBCFG = (window.ALLEVIARE_CONFIG || {});
function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
const SB = {
  url: (SBCFG.supabaseUrl || "").replace(/\/$/, ""), key: SBCFG.supabaseAnonKey || "", since: null, timer: null, outbox: [],
  async rpc(fn, args) {
    let r; try { r = await fetch(this.url + "/rest/v1/rpc/" + fn, { method: "POST", headers: Object.assign({ apikey: this.key, "Content-Type": "application/json" }, /^eyJ/.test(this.key) ? { Authorization: "Bearer " + this.key } : {}), body: JSON.stringify(args || {}) }); }
    catch (e) { const er = new Error("sin_conexion"); er.code = "sin_conexion"; throw er; }
    const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) { j = txt; }
    if (!r.ok) { const m = (j && j.message) || String(txt || r.status); const er = new Error(m); er.code = m; throw er; }
    return j;
  },
  token() { return ls("al.token") || ""; },
  setSession(res) { ls("al.token", res.token); this.applyMe(res.staff); this.since = null; COLS.forEach(c => S[c] = {}); },
  applyMe(me) { APP.user = me.nombre; APP.nid = me.id; APP.cedula = me.cedula || ""; APP.perms = me.permisos || []; APP.dir = !!me.direccion; ss("al.last", me.id); },
  clearSession() { ls("al.token", null); APP.user = ""; APP.nid = ""; APP.rol = ""; COLS.forEach(c => S[c] = {}); this.since = null; },
  async pull() {
    const t = this.token(); if (!t) return;
    await this.flush();
    try {
      const res = await this.rpc("api_pull", { p_token: t, p_since: this.since });
      this.applyMe(res.me); let n = 0;
      (res.docs || []).forEach(d => { if (!S[d.col]) return; if (Store.pending.has(d.col + "/" + d.id)) return; if (d.deleted) delete S[d.col][d.id]; else S[d.col][d.id] = d.data; n++; });
      this.since = new Date(Date.parse(res.now) - 5000).toISOString();
      Store.err = this.outbox.length ? "Sin conexión: " + this.outbox.length + " cambio(s) por enviar." : "";
      if (n || !Store.loaded) { Store.loaded = true; scheduleRender(); }
    } catch (e) {
      if (/sesion_invalida/.test(e.code)) { this.clearSession(); Store.loaded = true; toast("Tu sesión terminó. Vuelve a entrar."); render(); return; }
      Store.loaded = true; Store.err = "Sin conexión con el servidor. Lo que registres se enviará al volver la señal."; scheduleRender();
    }
  },
  loadOutbox() { try { this.outbox = JSON.parse(ls("al.outbox") || "[]"); } catch (e) { this.outbox = []; } },
  saveOutbox() { ls("al.outbox", JSON.stringify(this.outbox)); },
  async put(c, o) {
    const k = c + "/" + o.id; Store.pending.add(k);
    try { await this.rpc("api_put", { p_token: this.token(), p_col: c, p_id: o.id, p_data: JSON.parse(JSON.stringify(o)) }); Store.pending.delete(k); this.outbox = this.outbox.filter(x => x.k !== k); this.saveOutbox(); }
    catch (e) {
      if (e.code === "sin_conexion") { this.outbox = this.outbox.filter(x => x.k !== k).concat([{ k, c, o }]); this.saveOutbox(); Store.err = "Sin conexión: " + this.outbox.length + " cambio(s) por enviar."; scheduleRender(); }
      else { Store.pending.delete(k); toast(/sin_permiso/.test(e.code) ? "Tu rol no permite este cambio" : /sesion_invalida/.test(e.code) ? "Tu sesión terminó. Vuelve a entrar." : "No se guardó: " + e.code); }
    }
  },
  async flush() { if (!this.outbox.length) return; const xs = this.outbox.slice(); for (const x of xs) { await this.put(x.c, x.o); if (this.outbox.some(y => y.k === x.k)) break; } },
  async del(c, id) { try { await this.rpc("api_delete", { p_token: this.token(), p_col: c, p_id: id }); } catch (e) { toast("No se pudo borrar"); } },
  async init() {
    Store.mode = "sb"; Store.loaded = false; this.loadOutbox(); render();
    try { Store.staff = await this.rpc("api_staff_list", {}); } catch (e) { Store.staff = []; Store.err = "No se pudo conectar con el servidor."; }
    if (this.token()) await this.pull(); else { Store.loaded = true; render(); }
    clearInterval(this.timer); this.timer = setInterval(() => { if (!document.hidden) this.pull(); }, 15000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) this.pull(); });
    window.addEventListener("online", () => this.pull());
  }
};

const saveTimers = {};
function saveSoon(c, o, ms = 700) { clearTimeout(saveTimers[o.id]); if (Store.db || Store.mode === "sb") Store.pending.add(c + "/" + o.id); saveTimers[o.id] = setTimeout(() => Store.put(c, o), ms); }
function audit(o, what) { o.audit = o.audit || []; o.audit.push({ t: iso(), who: APP.user || "—", what }); if (o.audit.length > 400) o.audit.splice(0, o.audit.length - 400); }

/* ============ binding de formularios ============ */
let BINDS = {}, bindN = 0;
function bnd(obj, onch) { const k = "b" + (++bindN); BINDS[k] = { obj, onch }; return k; }
function fireBind(el, val) { const t = BINDS[el.dataset.o]; if (!t) return; setPath(t.obj, el.dataset.b, val); t.onch && t.onch(el.dataset.b, val); }
document.addEventListener("input", e => { const el = e.target; if (!el.dataset || !el.dataset.o || el.dataset.b == null) return; let v = el.type === "checkbox" ? el.checked : el.value; if (el.type === "number" && v !== "") v = Number(v); fireBind(el, v); });
document.addEventListener("change", e => { const el = e.target; if (el.tagName === "SELECT" && el.dataset.o) fireBind(el, el.value); });
document.addEventListener("click", e => {
  const ch = e.target.closest(".chip[data-o]"); if (!ch) return;
  const t = BINDS[ch.dataset.o]; if (!t) return; const path = ch.dataset.b, v = ch.dataset.v;
  if (ch.dataset.multi) { let arr = getPath(t.obj, path); arr = Array.isArray(arr) ? arr.slice() : []; const i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); ch.classList.toggle("on", i < 0); fireBind(ch, arr); }
  else { const cur = getPath(t.obj, path); const nv = cur === v ? "" : v; ch.parentElement.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.dataset.v === nv)); fireBind(ch, nv); }
});
const I = (k, obj, path, attrs = "") => `<input data-o="${k}" data-b="${path}" value="${esc(getPath(obj, path) ?? "")}" ${attrs}>`;
const TA = (k, obj, path, attrs = "") => `<textarea data-o="${k}" data-b="${path}" ${attrs}>${esc(getPath(obj, path) ?? "")}</textarea>`;
const SEL = (k, obj, path, opts, ph = "Seleccionar…") => { const cur = getPath(obj, path) ?? ""; return `<select data-o="${k}" data-b="${path}"><option value="">${ph}</option>${opts.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${String(cur) === String(v) ? "selected" : ""}>${esc(l)}</option>`; }).join("")}</select>`; };
const CHIPS = (k, obj, path, opts, multi) => { const cur = getPath(obj, path); return `<div class="chips">${opts.map(o => { const on = multi ? (Array.isArray(cur) && cur.includes(o)) : cur === o; return `<button type="button" class="chip ${on ? "on" : ""}" data-o="${k}" data-b="${path}" data-v="${esc(o)}" ${multi ? 'data-multi="1"' : ""}>${esc(o)}</button>`; }).join("")}</div>`; };
const F = (label, inner, cls = "") => `<label class="f ${cls}"><span>${esc(label)}</span>${inner}</label>`;

/* ============ deferir render mientras se escribe ============ */
let renderQueued = false;
function scheduleRender() { if (renderQueued) return; renderQueued = true; requestAnimationFrame(() => { const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && $("#main").contains(a)) { renderQueued = false; a.addEventListener("blur", () => scheduleRender(), { once: true }); return; } renderQueued = false; render(); }); }

/* ============ consultas ============ */
const patients = () => Object.values(S.patients);
const shiftsOf = pid => Object.values(S.shifts).filter(s => s.patientId === pid).sort((a, b) => (b.fecha + b.creadoEn).localeCompare(a.fecha + a.creadoEn));
const itemsOf = owner => Object.values(S.items).filter(i => norm(i.owner) === norm(owner));
const knownNurses = () => { const set = new Map(); Object.values(S.nurses || {}).filter(n => n.activa !== false).forEach(n => set.set(norm(n.nombre), n.nombre)); Object.values(S.items).forEach(i => i.owner && set.set(norm(i.owner), i.owner)); Object.values(S.shifts).forEach(s => s.enfermera && set.set(norm(s.enfermera), s.enfermera)); return [...set.values()].sort(); };
const nivelOf = p => NIVELES[p.nivel] || NIVELES.intermedio;
function lastEval(pid) { for (const s of shiftsOf(pid)) { const ev = live(s.evaluaciones).slice().sort((a, b) => (b.hora || "").localeCompare(a.hora || ""))[0]; if (ev) return { ev, s }; } return null; }
function pendientes(p) {
  const out = []; const sh = shiftsOf(p.id);
  if (p.privacidad !== "Sí") out.push(["warn", "Aviso de privacidad pendiente"]);
  const ram = sh.flatMap(s => live(s.admin).filter(a => a.ram && !a.ramNotificada)); if (ram.length) out.push(["bad", ram.length + " reacción adversa por notificar (farmacovigilancia)"]);
  if (!sh.length) out.push(["warn", "Sin turnos registrados"]);
  else {
    const last = sh[0];
    const hrs = (Date.now() - new Date(last.updatedAt || last.creadoEn)) / 36e5;
    if (!last.cerrado && hrs > 14) out.push(["warn", "Turno abierto hace " + Math.round(hrs) + " h"]);
    if (p.estado === "activo" && hrs > 30) out.push(["warn", "Sin registro en " + Math.round(hrs) + " h"]);
    const om = sh.filter(s => daysTo(s.fecha) >= -1).flatMap(s => live(s.admin).filter(a => a.estado === "omitido"));
    if (om.length) out.push(["bad", om.length + " dosis no aplicada" + (om.length > 1 ? "s" : "") + " (48 h)"]);
    const le = lastEval(p.id); if (le) { const al = ALERTAS(le.ev); if (al.length) out.push(["bad", "Alerta: " + al.join(", ")]); }
  }
  return out;
}

function bindDirLogin() { const bk = $("#dir-back"); if (bk) bk.onclick = () => { APP.view = "enf"; render(); }; const f = $("#dlog"); if (!f) return; f.onsubmit = async e => { e.preventDefault(); const bt = f.querySelector("button"); bt.disabled = true;
  try { const res = await SB.rpc("api_dir_login", { p_usuario: $("#d-user").value, p_pass: $("#d-pass").value }); SB.setSession(res); staffLoaded = false; Store.loaded = false; render(); await SB.pull(); toast("Bienvenida, " + APP.user.split(" ")[0]); }
  catch (er) { bt.disabled = false; $("#d-pass").value = ""; toast(/pin_incorrecto|no_encontrada/.test(er.code) ? "Usuario o contraseña incorrectos" : /bloqueada/.test(er.code) ? "Demasiados intentos. Espera 15 minutos." : "No se pudo entrar: " + er.code); } }; }
function dirHTML() {
  if (Store.mode !== "sb") return `<div class="stack gate"><h1>Dirección</h1><div class="card">La gestión de personal y permisos funciona en la versión publicada en GitHub, conectada al servidor de Alleviare.</div></div>`;
  if (!APP.dir) return dirLoginHTML();
  if (!staffLoaded) { loadStaffAll(); return `<div class="empty">Cargando personal…</div>`; }
  const all = Store.staffAll || [];
  const pend = all.filter(n => n.activa && n.tienePin && !(n.permisos || []).length);
  const xs = dirFilter === "pend" ? pend : dirFilter === "inact" ? all.filter(n => !n.activa) : all.filter(n => n.activa);
  const card = n => `<div class="card stack">
      <div class="row between"><div><h3>${esc(n.nombre)}</h3><div class="small muted">${n.tipo === "otro" ? esc(n.puesto || "Otro personal") : (n.tipo === "medico" ? "Médico(a)" : "Enfermería") + " · Cédula " + esc(n.cedula || "—")} · Tel. ${esc(n.telefono || "—")}${n.fechaNac ? " · Nac. " + fmtD(n.fechaNac) : ""}</div><div class="small muted">Registrada el ${fmtD(n.creadoEn)}</div></div>
        <div class="row">${!n.activa ? `<span class="pill bad">Inactiva</span>` : !n.tienePin ? `<span class="pill warn">Debe crear contraseña</span>` : (n.permisos || []).length ? `<span class="pill ok">Con acceso</span>` : `<span class="pill warn">Pendiente de autorizar</span>`}${n.bloqueada ? `<span class="pill bad">Bloqueada 15 min</span>` : ""}</div></div>
      <div class="sec-t">Tiene acceso a</div>
      <div class="perms">${PERMS.map(([p, l, d]) => { const on = (n.permisos || []).includes(p); return `<label class="perm ${on ? "on" : ""} ${n.activa ? "" : "off"}"><input type="checkbox" data-perm="${p}" data-sid="${n.id}" ${on ? "checked" : ""} ${n.activa ? "" : "disabled"}><div><b>${l}</b><span>${d}</span></div></label>`; }).join("")}</div>
      <div class="row"><button class="btn quiet sm" data-sreset="${n.id}">Restablecer contraseña</button><button class="btn ${n.activa ? "danger" : "quiet"} sm" data-stoggle="${n.id}" data-on="${n.activa ? 1 : 0}">${n.activa ? "Desactivar" : "Activar"}</button><button class="btn danger sm" data-sdel="${n.id}">Eliminar</button></div>
    </div>`;
  return `<div class="stack">
    <div class="row between"><h1>Dirección</h1><button class="btn ghost sm" id="dir-pass">Cambiar mi contraseña</button></div>
    <p class="muted">Autoriza a cada persona registrada y marca a qué secciones entra. Los cambios aplican de inmediato.</p>
    ${(() => { const a = invAlertas(); return a.total || a.sinInv.length ? `<div class="alert warn row between"><span><b>Insumos:</b> ${a.agot.length} agotados, ${a.bajo.length} por terminarse, ${a.cad.length} caducados, ${a.por.length} por caducar${a.sinInv.length ? ` · ${a.sinInv.length} enfermera(s) sin inventario` : ""}.</span><button class="btn sm" id="dir-alr">Ver alertas</button></div>` : ""; })()}
    <div class="kpis"><div class="kpi ${pend.length ? "warn" : "ok"}"><b>${pend.length}</b><span>Pendientes de autorizar</span></div><div class="kpi"><b>${all.filter(n => n.activa && (n.permisos || []).length).length}</b><span>Con acceso</span></div><div class="kpi"><b>${all.filter(n => !n.activa).length}</b><span>Inactivas</span></div></div>
    <div class="tabs" id="dtabs">${[["pend", "Pendientes"], ["act", "Activas"], ["inact", "Inactivas"]].map(([id, l]) => `<button data-dtab="${id}" class="${dirFilter === id ? "on" : ""}">${l}</button>`).join("")}</div>
    ${xs.length ? xs.map(card).join("") : `<div class="empty">${dirFilter === "pend" ? "No hay registros pendientes." : "Sin personas en esta lista."}</div>`}
  </div>`;
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-dtab]"); if (t) { dirFilter = t.dataset.dtab; render(); }
  if (e.target.id === "dir-alr") { APP.view = "adm"; admTab = "alr"; render(); }
  const r = e.target.closest("[data-sreset]"); if (r) confirmBox("¿Restablecer la contraseña? La persona vuelve a \"Registrarme\" con los mismos datos y crea una nueva.", () => staffUpd(r.dataset.sreset, { p_reset: true }, "Contraseña restablecida"));
  const x = e.target.closest("[data-sdel]"); if (x) { const n = (Store.staffAll || []).find(s => s.id === x.dataset.sdel); if (n) {
    modal(`<h2>Eliminar a ${esc(n.nombre)}</h2><p>Su cuenta se borra y ya no aparecerá para entrar ni en las listas.</p><p class="small muted">Los turnos, firmas y movimientos de inventario que registró se conservan en los expedientes, como lo exige la NOM-004. Si solo dejará de trabajar por un tiempo, mejor usa "Desactivar".</p>${F("Para confirmar escribe ELIMINAR", `<input id="sd-c" autocomplete="off">`)}<div class="row"><button class="btn danger" id="sd-ok">Eliminar definitivamente</button><button class="btn quiet" data-close>Cancelar</button></div>`);
    $("#sd-ok").onclick = () => { if ($("#sd-c").value.trim().toUpperCase() !== "ELIMINAR") return toast("Escribe ELIMINAR para confirmar"); SB.rpc("api_staff_delete", { p_token: SB.token(), p_id: n.id }).then(() => { closeModal(); Store.staffAll = Store.staffAll.filter(s => s.id !== n.id); SB.rpc("api_staff_list", {}).then(l => Store.staff = l).catch(() => { }); render(); toast("Cuenta eliminada"); }).catch(er => toast("No se pudo: " + er.code)); };
  } }
  const g = e.target.closest("[data-stoggle]"); if (g) staffUpd(g.dataset.stoggle, { p_activa: g.dataset.on !== "1" }, g.dataset.on === "1" ? "Desactivada" : "Activada");
  if (e.target.id === "dir-pass") {
    modal(`<h2>Cambiar mi contraseña</h2>${F("Contraseña actual", `<input id="dp-a" type="password" autocomplete="current-password">`)}${F("Nueva contraseña (mínimo 8 caracteres)", `<input id="dp-n" type="password" autocomplete="new-password">`)}${F("Repite la nueva", `<input id="dp-n2" type="password" autocomplete="new-password">`)}<div class="row"><button class="btn" id="dp-ok">Guardar</button><button class="btn quiet" data-close>Cancelar</button></div>`);
    $("#dp-ok").onclick = () => { const a = $("#dp-a").value, n = $("#dp-n").value; if (n.length < 8) return toast("Mínimo 8 caracteres"); if (n !== $("#dp-n2").value) return toast("Las contraseñas no coinciden"); SB.rpc("api_dir_password", { p_token: SB.token(), p_actual: a, p_nueva: n }).then(() => { closeModal(); toast("Contraseña actualizada"); }).catch(er => toast(/pin_incorrecto/.test(er.code) ? "La contraseña actual no es correcta" : "No se pudo: " + er.code)); };
  }
});

/* --- coordinación: enfermeras registradas (versión prototipo) --- */
function staffHTML() {
  const xs = nurses().sort((a, b) => a.nombre.localeCompare(b.nombre));
  return `<div class="stack"><div class="row"><button class="btn quiet sm" data-go="${goA({ p: "home" })}">← Pacientes</button></div>
    <h1>Enfermeras registradas</h1>
    ${xs.length ? `<div class="tbl-wrap"><table><thead><tr><th>Nombre</th><th>Cédula</th><th>Nacimiento</th><th>Registro</th><th>Estado</th><th></th></tr></thead><tbody>${xs.map(n => `<tr><td><b>${esc(n.nombre)}</b></td><td class="num">${esc(n.cedula)}</td><td class="num small">${fmtD(n.fechaNac)} (${age(n.fechaNac)} a)</td><td class="small num">${fmtDT(n.creadoEn)}</td><td>${n.activa === false ? `<span class="pill bad">Inactiva</span>` : n.codeHash ? `<span class="pill ok">Activa</span>` : `<span class="pill warn">Sin contraseña</span>`}</td><td class="small"><button class="link" data-nreset="${n.id}">Restablecer contraseña</button> · <button class="link" data-ntoggle="${n.id}">${n.activa === false ? "Activar" : "Desactivar"}</button></td></tr>`).join("")}</tbody></table></div>` : `<div class="empty">Aún no hay enfermeras registradas.</div>`}
    <p class="small muted">"Restablecer contraseña" borra la contraseña actual: la enfermera vuelve a "Registrarme" con su misma cédula y crea una nueva. Una enfermera inactiva ya no puede entrar.</p></div>`;
}
document.addEventListener("click", e => {
  const r = e.target.closest("[data-nreset]"); if (r) confirmBox("¿Restablecer la contraseña de esta enfermera?", () => { const n = S.nurses[r.dataset.nreset]; n.codeHash = ""; audit(n, "Contraseña restablecida por coordinación"); Store.put("nurses", n); render(); toast("Contraseña restablecida"); });
  const t = e.target.closest("[data-ntoggle]"); if (t) { const n = S.nurses[t.dataset.ntoggle]; n.activa = n.activa === false; audit(n, n.activa ? "Activada" : "Desactivada"); Store.put("nurses", n); render(); }
});

function noRolHTML(t) { return `<div class="stack gate"><h1>${esc(t)}</h1><div class="card">No tienes acceso a esta sección. Si te corresponde, pide a Dirección que te lo autorice.</div></div>`; }
function pinHTML(w) { const c = w === "adm"; return `<div class="stack" style="max-width:420px;margin:6vh auto 0"><h1>${c ? "Administración" : "Coordinación de enfermería"}</h1><p class="muted">${c ? "Servicios, horas, traslados e insumos por paciente para generar cotizaciones." : "Esta vista muestra a todos los pacientes."} Ingresa el código de acceso.</p><form id="pin" class="stack card">${F("Código", `<input id="pin-v" type="password" inputmode="numeric" autocomplete="off">`)}<button class="btn">Abrir</button><p class="small muted">Prototipo: el código es ${c ? ADM_PIN : COORD_PIN}. En producción se reemplaza por usuarios y roles reales.</p></form></div>`; }
function bindPin(w) { $("#pin").onsubmit = e => { e.preventDefault(); const c = w === "adm"; if ($("#pin-v").value === (c ? ADM_PIN : COORD_PIN)) { if (c) { APP.admOk = true; ss("al.adm", "1"); } else { APP.coordOk = true; ss("al.coord", "1"); } render(); } else toast("Código incorrecto"); }; }

/* ============ ENFERMERÍA: inicio con buscador ============ */
let searchQ = "";
function nurseHomeHTML() {
  const mine = Object.values(S.shifts).filter(s => norm(s.enfermera) === norm(APP.user) && !s.cerrado);
  const myItems = itemsOf(APP.user); const low = myItems.filter(i => i.tipo !== "Equipo" && +i.cantidad <= +(i.minimo || 0)).length; const exp = myItems.filter(i => daysTo(i.caducidad) <= 30 && +i.cantidad > 0).length;
  return `<div class="stack">
    <div class="row between"><h1>Buscar paciente</h1><div class="row"><button class="btn ghost" data-go="${goA({ p: "myinv" })}">Mi inventario${low + exp ? ` <span class="pill bad">${low + exp}</span>` : ""}</button><button class="btn" data-go="${goA({ p: "new" })}">Registrar paciente</button></div></div>
    ${!myItems.length ? `<div class="alert warn row between"><span><b>Registra tu inventario.</b> Es obligatorio antes de iniciar un turno.</span><button class="btn sm" data-go="${goA({ p: "myinv" })}">Registrar</button></div>` : !lastConteo(APP.user) || daysTo(lastConteo(APP.user).slice(0, 10)) < -7 ? `<div class="alert row between"><span>Confirma tu inventario de esta semana.</span><button class="btn ghost sm" data-go="${goA({ p: "myinv" })}">Revisar</button></div>` : ""}
    <div class="card stack">
      ${F("Nombre del paciente", `<input id="q" type="search" autocomplete="off" placeholder="Escribe al menos 4 letras del nombre o apellido" value="${esc(searchQ)}">`)}
      <div id="q-res">${searchResults()}</div>
      <p class="small muted">Por privacidad no se muestra la lista de pacientes: solo aparecen los que coinciden con lo que escribes.</p>
    </div>
    ${misServiciosHTML()}
    ${mine.length ? `<div class="stack"><div class="sec-t">Mis turnos abiertos</div>${mine.map(s => { const p = S.patients[s.patientId]; return p ? `<div class="card row between lvl lvl-${p.nivel}"><div><b>${esc(p.nombre)}</b><div class="small muted">${fmtD(s.fecha)} · ${esc(s.turno)}</div></div><button class="btn sm" data-go="${goA({ p: "shift", sid: s.id })}">Continuar turno</button></div>` : ""; }).join("")}</div>` : ""}
    ${!patients().length ? emptyDemo() : ""}
  </div>`;
}
function emptyDemo() { return `<div class="empty stack" style="align-items:center"><b>Aún no hay pacientes registrados.</b><span>${Store.mode === "sb" ? "Registra el primero para comenzar." : "Registra el primero o carga un ejemplo para ver cómo funciona todo el flujo."}</span>${Store.mode === "sb" ? "" : `<button class="btn quiet" id="demo">Cargar datos de ejemplo</button>`}</div>`; }
document.addEventListener("click", e => { if (e.target.id === "demo") loadDemo(); });
function searchResults() {
  const q = norm(searchQ); if (q.length < 4) return `<div class="small muted">Sin búsqueda.</div>`;
  const toks = q.split(" ");
  const res = patients().filter(p => { const words = norm(p.nombre).split(" "); return toks.every(t => words.some(w => w.startsWith(t))); }).slice(0, 5);
  if (!res.length) return `<div class="small muted">No se encontró ningún paciente con ese nombre. Revisa la ortografía o regístralo.</div>`;
  return `<div class="list">${res.map(p => `<div class="it"><div><b>${esc(p.nombre)}</b><div class="small muted">${age(p.fechaNac)} años · ${esc(nivelOf(p).n)} · ${p.estado === "activo" ? "Activo" : esc(p.estado)}</div></div><button class="btn sm" data-go="${goA({ p: "patient", pid: p.id })}">Abrir</button></div>`).join("")}</div>`;
}
document.addEventListener("input", e => { if (e.target.id === "q") { searchQ = e.target.value; $("#q-res").innerHTML = searchResults(); } });

/* ============ registro de paciente ============ */
let newP = null;
function blankPatient() { return { nombre: "", fechaNac: "", sexo: "", diagnostico: "", domicilio: "", responsable: "", telResp: "", alergias: "", privacidad: "", medicoTratante: MEDICOS[0], medicoOtro: "", nivel: "intermedio", tipoAtencion: "Primera vez", fechaRegistro: today() }; }
function newPatientHTML() {
  if (!newP) newP = blankPatient(); const k = bnd(newP, () => { });
  return `<div class="stack">
    <div class="row between"><h1>Registrar paciente</h1><button class="btn quiet" data-go="${goA({ p: "home" })}">Cancelar</button></div>
    <form id="np" class="stack">
      <div class="card stack"><div class="sec-t">Datos del paciente</div>
        <div class="fieldgrid">
          ${F("Nombre completo", I(k, newP, "nombre", 'required autocomplete="off"'), "full")}
          ${F("Fecha de nacimiento", I(k, newP, "fechaNac", 'type="date" required'))}
          ${F("Sexo", SEL(k, newP, "sexo", ["Mujer", "Hombre"]))}
          ${F("Fecha de registro", I(k, newP, "fechaRegistro", 'type="date"'))}
          ${F("Diagnóstico principal", I(k, newP, "diagnostico"), "full")}
          ${F("Alergias", I(k, newP, "alergias", 'placeholder="Negadas"'), "full")}
          ${F("Domicilio", I(k, newP, "domicilio"), "full")}
          ${F("Familiar responsable", I(k, newP, "responsable"))}
          ${F("Teléfono del responsable", I(k, newP, "telResp", 'type="tel"'))}
          ${F("Médico tratante", SEL(k, newP, "medicoTratante", MEDICOS.concat(["Otro"]), "—"))}
          ${F("Otro médico (especificar)", I(k, newP, "medicoOtro"))}
        </div></div>
      <div class="card stack"><div class="sec-t">Documentos del expediente</div>
        ${newP.aviso ? `<div class="alert ok small">Aviso de privacidad firmado por <b>${esc(newP.aviso.firmadoPor)}</b> (${esc(newP.aviso.relacion)}).</div>` : `<div class="row"><button class="btn ghost" type="button" id="np-aviso">Leer y firmar aviso de privacidad</button></div><p class="small muted">Requerido para el tratamiento de datos de salud. Puede firmarlo ahora el paciente o familiar en esta pantalla; si no está presente, guarda al paciente y envíale el enlace para firmar desde su celular.</p>`}</div>
      <div class="card stack"><div class="sec-t">Tipo de atención</div>${CHIPS(k, newP, "tipoAtencion", ["Primera vez", "Subsecuente"])}</div>
      <div class="card stack"><div class="sec-t">Complejidad del paciente</div><p class="small muted">Define qué datos se piden en cada evaluación. Se puede cambiar después según la evolución.</p>
        <div class="grid wide">${Object.entries(NIVELES).map(([id, n]) => `<label class="card lvl lvl-${id}" style="cursor:pointer"><input type="radio" name="nivel" value="${id}" data-o="${k}" data-b="nivel" ${newP.nivel === id ? "checked" : ""}> <b>${esc(n.n)}</b><div class="small muted">${esc(n.d)}</div></label>`).join("")}</div></div>
      <div class="row"><button class="btn" type="submit">Guardar paciente</button></div>
    </form></div>`;
}
document.addEventListener("submit", e => {
  if (e.target.id !== "np") return; e.preventDefault();
  const p = newP; if (!p.nombre.trim() || !p.fechaNac) { toast("Nombre y fecha de nacimiento son obligatorios"); return; }
  const dup = patients().find(x => norm(x.nombre) === norm(p.nombre) && x.fechaNac === p.fechaNac);
  if (dup) { toast("Ese paciente ya existe. Se abrió su expediente."); newP = null; go({ p: "patient", pid: dup.id }); return; }
  const o = Object.assign({ id: uid("p"), estado: "activo", meds: [], indicaciones: [], creadoPor: APP.user, creadoEn: iso(), nivelHist: [{ nivel: p.nivel, t: iso(), who: APP.user }] }, p);
  o.nombre = o.nombre.trim(); audit(o, "Registro del paciente (" + o.tipoAtencion + ", " + NIVELES[o.nivel].n + ")");
  Store.put("patients", o); newP = null; toast("Paciente registrado"); go({ p: "patient", pid: o.id });
});

/* ============ expediente del paciente ============ */
const medLabel = m => `${m.nombre} ${m.dosis || ""} ${m.via || ""}`.replace(/\s+/g, " ").trim();
function medicoTxt(o) { return o.medico === "Otro" ? (o.medicoOtro || "Otro") : (o.medico || "—"); }
let pTab = "turnos";
function patientHTML(pid, coord) {
  const p = S.patients[pid]; if (!p) return `<div class="empty">Paciente no encontrado.</div>`;
  const back = coord ? `<button class="btn quiet sm" data-go="${goA({ p: "home" })}">← Pacientes</button>` : `<button class="btn quiet sm" data-go="${goA({ p: "home" })}">← Buscar</button>`;
  const sh = shiftsOf(pid); const open = sh.find(s => !s.cerrado && norm(s.enfermera) === norm(APP.user));
  const tabs = coord ? [["turnos", "Turnos"], ["graficas", "Evolución"], ["comentarios", "Comentarios"], ["meds", "Medicamentos"], ["datos", "Datos y complejidad"], ["bitacora", "Bitácora"]] : [["turnos", "Turnos"], ["meds", "Medicamentos e indicaciones"], ["datos", "Datos y complejidad"]];
  if (!tabs.some(t => t[0] === pTab)) pTab = "turnos";
  let body = "";
  if (pTab === "turnos") body = turnosTabHTML(p, sh, coord);
  else if (pTab === "meds") body = medsTabHTML(p);
  else if (pTab === "datos") body = datosTabHTML(p, coord);
  else if (pTab === "graficas") body = graficasHTML(p);
  else if (pTab === "comentarios") body = comentariosHTML(p);
  else if (pTab === "bitacora") body = bitacoraHTML(p);
  const pend = coord ? pendientes(p) : [];
  return `<div class="stack">

const money = n => "$" + (Math.round((+n || 0) * 100) / 100).toLocaleString("es-MX", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const r2 = n => Math.round((+n || 0) * 100) / 100;
// Categorías del catálogo. modo: producto (costo + margen), servicio (honorario + cuota Alleviare), renta / simple (precio directo).
const CATS = [
  ["med", "Medicamentos", "producto", "0"],

  ["otr", "Otros conceptos", "simple", "16"]

const catOf = id => CATS.find(c => c[0] === id) || CATS[CATS.length - 1];
const IVAS = [["16", "IVA 16 %"], ["0", "Tasa 0 %"], ["ex", "Exento"]];

const EMPRESA0 = { id: "empresa", razon: "", comercial: "Alleviare", rfc: "", regimen: "", calle: "Amado Nervo 59", colonia: "Ladrón de Guevara", cp: "44600", ciudad: "Guadalajara", estado: "Jalisco", tel: "", correo: "", web: "", avisoFunc: "", vigencia: 15, margen: 40, margenMin: 38, margenMax: 45, cuentas: [], ligas: [] };
const empresa = () => { const e = S.ventas && S.ventas.empresa; return e ? Object.assign(clone(EMPRESA0), e) : clone(EMPRESA0); };
const catalogo = () => Object.values(S.ventas || {}).filter(x => x.doc === "cat" && !x.borrado);

function precioCat(c) {
  const m = catOf(c.cat)[2];
  if (m === "producto") { if (+c.precioFinal > 0) return +c.precioFinal; const mg = c.margen === "" || c.margen == null ? empresa().margen : +c.margen; return +c.costo ? Math.ceil(+c.costo * (1 + mg / 100)) : 0; }
  if (m === "servicio") return +c.precioFinal > 0 ? +c.precioFinal : (+c.honorario || 0) + (+c.cuota || 0);
  return +c.precio || 0;
}
const findCat = (clave, nombre, codigo) => { const xs = catalogo(); return (clave && xs.find(c => c.clave === clave)) || (codigo && xs.find(c => c.codigo && c.codigo === codigo)) || (nombre && xs.find(c => norm(c.nombre) === norm(nombre))) || null; };
const catFromItem = it => it ? ({ Medicamento: "med", "Solución": "sol", Equipo: "ren" }[it.tipo] || (/elastom/i.test(it.nombre) ? "bom" : "ins")) : "ins";

/* --- cotización calculada desde los turnos + ajustes de Administración --- */
const cotDoc = pid => { const sv = admSel.srv && S.config[admSel.srv]; const id = "cot_" + (sv && sv.pid === pid ? sv.id : pid); return S.ventas[id] ? S.ventas[id] : { id, doc: "cot", pid, ajustes: {}, extras: [], cliente: {}, pago: { metodo: "Transferencia" }, tipo: "Cotización", notas: "", emitidas: [] }; };
let admTab = "pac", admSel = { pid: "", srv: "", desde: "", hasta: "" };
function cotizacion(pid, desde, hasta) {
  const p = S.patients[pid]; if (!p) return null; const q = cotDoc(pid);
  const srv = admSel.srv && S.config[admSel.srv] && S.config[admSel.srv].pid === pid ? S.config[admSel.srv] : null;
  const sh = srv ? srvShifts(srv) : shiftsOf(pid).filter(s => (!desde || s.fecha >= desde) && (!hasta || s.fecha <= hasta)).reverse();
  const lines = [];
  const add = (key, concepto, cat, unidad, cant, c, fallback) => {
    if (!cant) return; let l = lines.find(x => x.key === key);
    if (!l) { l = { key, concepto: c ? c.nombre : concepto, cat: c ? c.cat : cat, unidad: (c && c.unidad) || unidad, cant: 0, pu: c ? precioCat(c) : (fallback ? fallback.pu : 0), iva: c ? (c.iva || catOf(c.cat)[3]) : (fallback ? fallback.iva : catOf(cat)[3]), sinCat: !c, auto: true, catId: c ? c.id : "" }; lines.push(l); }
    l.cant = r2(l.cant + cant);
  };
  sh.forEach(s => { const sv = s.servicio || {};
    (sv.servicios || []).forEach(n => { const nm = n === "Otro" && sv.otro ? "Otro: " + sv.otro : n; add("svc:" + nm, nm, "enf", "servicio", 1, findCat("svc:" + n, nm)); });
    const h = horasDe(sv); if (h) { const c = findCat("hora", "Hora de cuidado de enfermería"); if (c) add("hora", "Hora de cuidado de enfermería", "enf", "hora", h, c); }
    if (sv.distancia) add("dist:" + sv.distancia, "Atención a domicilio · trayecto " + distLabel(sv.distancia), "dom", "visita", 1, findCat("dist:" + sv.distancia));
    (s.insumos || []).forEach(x => { const it = x.itemId && S.items[x.itemId]; const c = findCat("", x.nombre, it && it.codigo); const cat = catFromItem(it);
      add("ins:" + (c ? c.id : norm(x.nombre)), x.nombre, cat, (it && it.unidad) || "pza", +x.cantidad, c, it && +it.precio ? { pu: Math.ceil(+it.precio * (1 + empresa().margen / 100)), iva: catOf(cat)[3] } : null); });
    if (s.bomba && s.bomba.usada) add("renta_bomba", "Renta de bomba de infusión eléctrica (por turno)", "ren", "turno", 1, findCat("renta_bomba", "Renta de bomba de infusión eléctrica (por turno)"));
  });
  if (srv) (srv.planeado || []).forEach(pl => { const c = S.ventas[pl.catId]; const k = planKey(pl, c); if (lines.some(l => l.key === k)) return; if (sh.length && ["ins:", "svc:", "hora", "dist:", "renta_bomba"].some(x => k.startsWith(x))) return; lines.push({ key: k, concepto: c ? c.nombre : pl.concepto, cat: c ? c.cat : (pl.cat || "otr"), unidad: (c && c.unidad) || "servicio", cant: +pl.cant, pu: c ? precioCat(c) : 0, iva: c ? (c.iva || catOf(c.cat)[3]) : "16", plan: true, auto: true }); });
  lines.forEach(l => { const a = q.ajustes[l.key]; if (a) { if (a.pu !== "" && a.pu != null) { l.puAuto = l.pu; l.pu = +a.pu; l.ajustado = true; } if (a.cant !== "" && a.cant != null) { l.cantAuto = l.cant; l.cant = +a.cant; l.ajustado = true; } if (a.iva) l.iva = a.iva; if (a.quitar) l.quitar = true; } });
  (q.extras || []).forEach(x => lines.push({ key: "x:" + x.id, xid: x.id, concepto: x.concepto, cat: x.cat || "otr", unidad: x.unidad || "servicio", cant: +x.cant || 0, pu: +x.pu || 0, iva: x.iva || catOf(x.cat || "otr")[3], extra: true }));
  const act = lines.filter(l => !l.quitar && l.cant);
  const base = { "16": 0, "0": 0, ex: 0 }; act.forEach(l => base[l.iva] = r2((base[l.iva] || 0) + l.cant * l.pu));
  const sub = r2(base["16"] + base["0"] + base.ex), iva = r2(base["16"] * 0.16);
  return { p, q, sh, srv, lines, act, base, sub, iva, total: r2(sub + iva) };
}

/* --- importe con letra --- */
function numLetra(n) {
  const U = ["", "UNO", "DOS", "TRES", "CUATRO", "CINCO", "SEIS", "SIETE", "OCHO", "NUEVE", "DIEZ", "ONCE", "DOCE", "TRECE", "CATORCE", "QUINCE", "DIECISÉIS", "DIECISIETE", "DIECIOCHO", "DIECINUEVE", "VEINTE", "VEINTIUNO", "VEINTIDÓS", "VEINTITRÉS", "VEINTICUATRO", "VEINTICINCO", "VEINTISÉIS", "VEINTISIETE", "VEINTIOCHO", "VEINTINUEVE"];
  const D = ["", "", "", "TREINTA", "CUARENTA", "CINCUENTA", "SESENTA", "SETENTA", "OCHENTA", "NOVENTA"];
  const C = ["", "CIENTO", "DOSCIENTOS", "TRESCIENTOS", "CUATROCIENTOS", "QUINIENTOS", "SEISCIENTOS", "SETECIENTOS", "OCHOCIENTOS", "NOVECIENTOS"];
  const dec = x => x < 30 ? U[x] : D[Math.floor(x / 10)] + (x % 10 ? " Y " + U[x % 10] : "");
  const cen = x => x === 100 ? "CIEN" : (C[Math.floor(x / 100)] + " " + dec(x % 100)).trim();
  const mil = x => { const m = Math.floor(x / 1000), r = x % 1000; return ((m ? (m === 1 ? "MIL" : cen(m).replace(/UNO$/, "UN") + " MIL") : "") + " " + cen(r)).trim(); };
  const ent = Math.floor(n), cts = Math.round((n - ent) * 100);
  const mill = Math.floor(ent / 1e6), resto = ent % 1e6;
  let t = (mill ? (mill === 1 ? "UN MILLÓN" : mil(mill).replace(/UNO$/, "UN") + " MILLONES") + (resto ? " " : " DE") : "") + (resto ? " " + mil(resto) : "");
  t = t.trim() || "CERO"; t = t.replace(/UNO$/, "UN");
  return `${t} ${ent === 1 ? "PESO" : "PESOS"} ${String(cts).padStart(2, "0")}/100 M.N.`;
}

function cotejo(s, sh) {

  const rows = []; const seen = new Set();
  s.planeado.forEach(pl => { const c = S.ventas[pl.catId]; const k = planKey(pl, c); seen.add(k); const r = real[k] || 0; rows.push([pl.concepto, pl.cant, r, ["ins:", "svc:", "hora", "dist:", "renta_bomba"].some(p => k.startsWith(p)) ? (r === pl.cant ? "ok" : r > pl.cant ? "warn" : "bad") : "acc"]); });
  Object.keys(real).filter(k => !k.startsWith("n:") && !seen.has(k)).forEach(k => rows.push([real["n:" + k] || k.replace(/^svc:/, "").replace(/^dist:/, "Trayecto ").replace("hora", "Horas de cuidado").replace("renta_bomba", "Renta de bomba"), 0, real[k], "warn"]));

    ${enf.length && s.enfermera && enf.some(n => norm(n) !== norm(s.enfermera)) ? `<div class="alert warn small">Enfermera asignada: ${esc(s.enfermera)} · atendió: ${enf.map(esc).join(", ")}</div>` : ""}
    <div class="list card">${rows.map(([n, a, b, c]) => `<div class="it small"><span>${esc(n)}</span><span class="num">cotizado <b>${a}</b> · real <b>${c === "acc" ? "—" : b}</b> <span class="pill ${c}">${c === "ok" ? "coincide" : c === "acc" ? "no lo registra enfermería" : b > a ? "de más" : "de menos"}</span></span></div>`).join("")}</div>`;
}

function finMesData(m) {

  const pagos = vs.flatMap(v => (v.pagos || []).filter(p => !p.anulado && mesDe(p.fecha) === m).map(p => Object.assign({ v }, p)));
  const cobrado = r2(pagos.reduce((a, p) => a + +p.monto, 0));
  const gs = gastos().filter(g => mesDe(g.fecha) === m); const gasto = r2(gs.reduce((a, g) => a + +g.monto, 0)); const ivaAcr = r2(gs.reduce((a, g) => a + (+g.iva || 0), 0));
  const porCat = {}; gs.forEach(g => porCat[g.cat] = r2((porCat[g.cat] || 0) + +g.monto));
  const porConcepto = {}; cxc.filter(v => mesDe(v.t) === m).forEach(v => (v.lines || []).forEach(l => { porConcepto[l.concepto] = r2((porConcepto[l.concepto] || 0) + l.cant * l.pu); }));
  const consumo = Object.values(S.moves).filter(mv => mv.tipo === "consumo" && mesDe(mv.t) === m); const costoIns = r2(consumo.reduce((a, mv) => a + (-mv.cantidad) * (+(S.items[mv.itemId] || {}).precio || 0), 0));
  const atenc = Object.values(S.shifts).filter(s => mesDe(s.fecha) === m);
  const sinCot = atenc.filter(s => !vs.some(v => v.pid === s.patientId && (!v.desde || s.fecha >= v.desde) && (!v.hasta || s.fecha <= v.hasta)));
  const enviadas = vs.filter(v => v.tipo !== "Nota de venta" && mesDe(v.t) === m); const acept = enviadas.filter(v => v.estadoCot === "Aceptada");
  return { m, vendido, ivaVend, cobrado, gasto, ivaAcr, porCat, porConcepto, costoIns, atenc, sinCot, enviadas, acept, utilidad: r2(cobrado - gasto), utilVenta: r2(vendido - gasto) };
}
function oportunidades(d, prev) {

  const sinPrecio = catalogo().filter(c => !precioCat(c)); if (sinPrecio.length) o.push(["acc", `${sinPrecio.length} concepto(s) del catálogo sin precio: las cotizaciones de esos servicios quedarán incompletas.`]);
  const cad = Object.values(S.items).filter(i => +i.cantidad > 0 && daysTo(i.caducidad) < 0); const merma = r2(cad.reduce((a, i) => a + i.cantidad * (+i.precio || 0), 0)); if (cad.length) o.push(["warn", `Merma por caducidad: ${cad.length} producto(s) caducados${merma ? " con costo de " + money(merma) : ""}. Ajustar mínimos y rotar primero lo que caduca antes.`]);

  doc.setFontSize(9); doc.setTextColor(90); doc.text(sub, W - M, 58, { align: "right" });

/* ============ lector de código de barras con la cámara del celular ============ */
function scanBtn(target) { return `<label class="btn quiet" style="align-self:flex-end" title="Tomar foto del código"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3M7 8v8M10 8v8M13 8v8M17 8v8"/></svg>Escanear<input type="file" accept="image/*" capture="environment" hidden data-scan="${target}"></label>`; }
document.addEventListener("change", async e => {
  const inp = e.target; if (!inp.dataset || !inp.dataset.scan || !inp.files || !inp.files[0]) return;
  const target = document.getElementById(inp.dataset.scan); toast("Leyendo código…");
  try { const code = await decodeBarcode(inp.files[0]); if (!code) { toast("No se detectó un código. Acerca la cámara, con buena luz, y vuelve a intentar."); return; } target.value = code; target.dispatchEvent(new Event("input", { bubbles: true })); target.dispatchEvent(new Event("scanned")); toast("Código leído: " + code); }
  catch (err) { console.error(err); toast("No se pudo leer el código: escríbelo a mano."); }
  inp.value = "";
});
async function decodeBarcode(file) {
  const bmp = await createImageBitmap(file);
  if ("BarcodeDetector" in window) { try { const det = new window.BarcodeDetector({ formats: ["ean_13", "ean_8", "upc_a", "upc_e", "code_128", "code_39", "qr_code", "data_matrix", "itf"] }); const r = await det.detect(bmp); if (r && r.length) return r[0].rawValue; } catch (e) { } }
  await loadZXing();
  const maxW = 1400, sc = Math.min(1, maxW / bmp.width); const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * sc); cv.height = Math.round(bmp.height * sc); cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
  const Z = window.ZXing; const hints = new Map(); hints.set(Z.DecodeHintType.TRY_HARDER, true);
  const reader = new Z.MultiFormatReader(); reader.setHints(hints);
  const tryCanvas = c => { const lum = new Z.HTMLCanvasElementLuminanceSource(c); const bb = new Z.BinaryBitmap(new Z.HybridBinarizer(lum)); try { return reader.decode(bb).getText(); } catch (e) { return null; } };
  let t = tryCanvas(cv); if (t) return t;
  const r = document.createElement("canvas"); r.width = cv.height; r.height = cv.width; const rc = r.getContext("2d"); rc.translate(r.width / 2, r.height / 2); rc.rotate(Math.PI / 2); rc.drawImage(cv, -cv.width / 2, -cv.height / 2);
  return tryCanvas(r);
}
let zxingP = null;
function loadZXing() { if (window.ZXing) return Promise.resolve(); if (!zxingP) zxingP = new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"; s.onload = res; s.onerror = () => { zxingP = null; rej(new Error("zxing")); }; document.head.appendChild(s); }); return zxingP; }

document.addEventListener("click", e => { if (e.target.closest("[data-close]") || e.target.classList.contains("modal-bg")) closeModal(); });

function confirmBox(msg, ok) { const prev = $("#modal-root").innerHTML; const host = document.createElement("div"); host.className = "modal-bg"; host.style.zIndex = 60; host.innerHTML = `<div class="modal stack" style="max-width:420px"><p>${esc(msg)}</p><div class="row"><button class="btn danger" id="cf-ok">Sí, continuar</button><button class="btn quiet" id="cf-no">Cancelar</button></div></div>`; document.body.appendChild(host); host.querySelector("#cf-ok").onclick = () => { host.remove(); ok(); }; host.querySelector("#cf-no").onclick = () => host.remove(); }
