<style>
/* Layout: una columna, encabezado blanco con logo y pestañas finas; tarjetas suaves sobre crema; serif del logo para títulos, sans redondeada para leer */
:root{
  --bg:#FAF6F3; --surface:#FFFFFF; --sunk:#F4EEEA; --ink:#2B2942; --muted:#6F6C85; --line:#ECE4E6; --line-2:#E2D8DC;
  --accent:#5A5FA3; --accent-2:#7C81C2; --accent-ink:#FFFFFF; --accent-soft:#EFEFF9; --pink:#EBADCF; --pink-soft:#FCEFF6; --cream:#F5E4D7;
  --ok:#2C7656; --ok-soft:#E6F3EC; --warn:#946016; --warn-soft:#FBF0DC; --bad:#B03A33; --bad-soft:#FBE8E5;
  --c1:#5A5FA3; --c2:#2A7F92; --c3:#C1603A; --c4:#438F57; --c5:#C25690; --c6:#8E7425;
  --shadow:0 1px 2px rgba(60,40,80,.05),0 6px 20px rgba(60,40,80,.06);
  --f-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15141D; --surface:#1E1C29; --sunk:#191723; --ink:#EFEDF7; --muted:#A8A5BD; --line:#2F2C40; --line-2:#3A3650;
  --accent:#B6B9EA; --accent-2:#9A9FD0; --accent-ink:#1A1930; --accent-soft:#292842; --pink:#E7A3C8; --pink-soft:#352230; --cream:#3A2F29;
  --ok:#66C99A; --ok-soft:#173226; --warn:#E6B45F; --warn-soft:#382A12; --bad:#F2847A; --bad-soft:#3C1D1B;
  --c1:#B6B9EA; --c2:#5FC4D7; --c3:#F09368; --c4:#80CC90; --c5:#EE8ABB; --c6:#DABF66;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15141D; --surface:#1E1C29; --sunk:#191723; --ink:#EFEDF7; --muted:#A8A5BD; --line:#2F2C40; --line-2:#3A3650;
  --accent:#B6B9EA; --accent-2:#9A9FD0; --accent-ink:#1A1930; --accent-soft:#292842; --pink:#E7A3C8; --pink-soft:#352230; --cream:#3A2F29;
  --ok:#66C99A; --ok-soft:#173226; --warn:#E6B45F; --warn-soft:#382A12; --bad:#F2847A; --bad-soft:#3C1D1B;
  --c1:#B6B9EA; --c2:#5FC4D7; --c3:#F09368; --c4:#80CC90; --c5:#EE8ABB; --c6:#DABF66;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.15}
h1{font-family:var(--f-display);font-weight:600;font-size:2rem;letter-spacing:.005em}
h2{font-family:var(--f-display);font-weight:600;font-size:1.45rem}
h3{font-size:1rem;font-weight:700}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* encabezado */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top::after{content:"";display:block;height:2px;background:linear-gradient(90deg,var(--pink),var(--accent-2) 60%,var(--cream))}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding-block:10px 0}
.brand img{height:40px;width:auto;max-width:100%;display:block}
.seg{order:3;width:100%;display:flex;gap:0;overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}.seg button[hidden]{display:none}
.seg button{border:0;background:none;cursor:pointer;color:var(--muted);font-weight:600;font-size:.76rem;padding:10px 5px 11px;flex:1 0 auto;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;letter-spacing:.01em}
.seg button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
@media (min-width:820px){.seg{order:0;width:auto;display:flex;gap:6px;align-self:stretch;overflow:visible}.seg button{padding:20px 12px 18px;font-size:.92rem;flex:none}}
.perms{display:grid;grid-template-columns:1fr 1fr;gap:8px}.perm{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:var(--surface)}.perm input{width:18px;height:18px;flex:none;margin:2px 0 0;accent-color:var(--accent)}.perm b{display:block;font-size:.9rem}.perm span{font-size:.75rem;color:var(--muted);line-height:1.3}.perm.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}.perm.off{opacity:.5;cursor:default}@media (max-width:420px){.perms{grid-template-columns:1fr}}
.who{margin-left:auto;font-size:.82rem;color:var(--muted);display:flex;gap:8px;align-items:center}
.who .av{width:30px;height:30px;border-radius:50%;background:var(--pink-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:.78rem;border:1px solid var(--line-2)}
.who b{color:var(--ink);font-weight:700}
main{padding-block:26px 90px}

/* estructura */
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0;box-shadow:var(--shadow)}
.card.flat{background:transparent;border-style:dashed;box-shadow:none}
.sec-t{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.num{font-variant-numeric:tabular-nums}
section[id]{scroll-margin-top:120px;padding-top:6px}
section[id] h2{display:flex;align-items:center;gap:10px}

/* formularios */
label.f{display:flex;flex-direction:column;gap:6px;font-size:.8rem;color:var(--muted);min-width:0}
label.f > span{font-weight:600;letter-spacing:.01em}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=tel],input[type=email],input[type=password],input[type=search],input:not([type]),select,textarea{
  background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:11px 13px;color:var(--ink);width:100%;min-width:0;font-size:1rem;transition:border-color .15s,box-shadow .15s}
input:hover,select:hover,textarea:hover{border-color:var(--accent-2)}
textarea{min-height:96px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:18px;height:18px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:10px 20px;border-radius:999px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-size:.93rem;letter-spacing:.01em;transition:transform .12s,box-shadow .15s,background .15s;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 28%,transparent)}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:none}
.btn.quiet{background:var(--surface);border-color:var(--line-2);color:var(--ink);box-shadow:none}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad);box-shadow:none}
.btn.sm{padding:6px 14px;font-size:.84rem}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:700;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 35%,transparent);text-underline-offset:3px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap;letter-spacing:.01em}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.lvl{position:relative;overflow:hidden}
.lvl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--muted)}
.lvl-basico::before{background:var(--c4)} .lvl-intermedio::before{background:var(--accent-2)} .lvl-alto::before{background:var(--bad)} .lvl-finvida::before{background:var(--pink)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.88rem;transition:background .12s,border-color .12s}
.chip:hover{border-color:var(--accent-2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.fieldgrid{display:grid;gap:14px 12px;grid-template-columns:repeat(auto-fill,minmax(145px,1fr))}
.fieldgrid .full{grid-column:1/-1}
details.mod{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
details.mod > summary{padding:16px 18px;cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.mod > summary::-webkit-details-marker{display:none}
details.mod > summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);flex:none;transition:transform .15s}
details.mod[open] > summary::after{transform:rotate(-135deg)}
details.mod > .in{padding:4px 18px 18px;border-top:1px solid var(--line)}
details.mod > .in > .stack > .sec-t,details.mod .in .sec-t{color:var(--accent);margin-top:6px}

/* listas y tablas */
.list{display:flex;flex-direction:column}
.list > .it{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.list > .it:last-child{border-bottom:0}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tbody tr:last-child td{border-bottom:0}
th{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;background:transparent;white-space:nowrap;border-bottom:1px solid var(--line-2)}
tr.click{cursor:pointer;transition:background .12s} tr.click:hover td{background:var(--pink-soft)}
.mar{border-collapse:separate;border-spacing:0;font-size:.75rem}
.mar th,.mar td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:5px 4px;text-align:center;min-width:26px}
.mar th{padding:8px 4px;letter-spacing:.04em}
.mar td.name{text-align:left;min-width:180px;white-space:normal;padding:8px 10px;position:sticky;left:0;background:var(--surface);z-index:1}
.mar td.a{background:var(--ok-soft);color:var(--ok);font-weight:700}
.mar td.o{background:var(--bad-soft);color:var(--bad);font-weight:700}
.mar td.m{background:var(--warn-soft);color:var(--warn);font-weight:700}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.kpi b{display:block;font-family:var(--f-display);font-weight:600;font-size:2.4rem;font-variant-numeric:lining-nums tabular-nums;line-height:1}
.kpi span{font-size:.8rem;color:var(--muted)}
.kpi.bad b{color:var(--bad)} .kpi.warn b{color:var(--warn)} .kpi.ok b{color:var(--ok)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line-2);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.empty{padding:32px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--r);background:color-mix(in srgb,var(--surface) 55%,transparent)}

/* modales y avisos */
.modal-bg{position:fixed;inset:0;background:rgba(30,20,40,.45);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:env(safe-area-inset-top,0px) 0 0}
.modal{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:24px max(18px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));box-shadow:0 -10px 40px rgba(30,20,40,.2)}
@media (min-width:700px){.modal-bg{align-items:center}.modal{border-radius:22px}}
.sig{width:100%;height:170px;background:#fff;border:1px dashed var(--accent-2);border-radius:12px;touch-action:none;display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;z-index:80;font-size:.9rem;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.chartbox{position:relative;height:230px}
.alert{padding:12px 14px;border-radius:12px;font-size:.9rem}
.alert.warn{background:var(--warn-soft);color:var(--warn)} .alert.bad{background:var(--bad-soft);color:var(--bad)} .alert.info{background:var(--accent-soft);color:var(--accent)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps a{display:inline-flex;gap:6px;align-items:center;font-size:.8rem;padding:5px 12px 5px 5px;border-radius:999px;background:var(--sunk);color:var(--muted);text-decoration:none;font-weight:600}
.steps a b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--surface);font-size:.72rem;font-variant-numeric:tabular-nums}
.steps a.done{background:var(--ok-soft);color:var(--ok)}
.steps a.done b{background:var(--ok);color:var(--surface)}
.hero-logo{display:flex;justify-content:center;padding-block:8px}
.hero-logo img{height:96px;width:auto}
.gate{max-width:440px;margin:4vh auto 0;text-align:center}
.gate .card{text-align:left}
.gate h1{font-size:2.2rem}
.hide-sm{display:none}
@media (min-width:520px){.hide-sm{display:inline}}
.tot{font-family:var(--f-display);font-size:2rem;font-weight:600;font-variant-numeric:lining-nums tabular-nums;color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.cl{padding:10px 0;border-bottom:1px solid var(--line)}.cl:last-child{border-bottom:0}.cl.off{opacity:.5}.cl.off .cl-h b:first-child{text-decoration:line-through}.cl-h{display:flex;justify-content:space-between;gap:12px;align-items:baseline}.cl-f{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-top:6px}.cl-f label{display:flex;flex-direction:column;font-size:.7rem;color:var(--muted);gap:2px}.cl-f label{flex:0 0 auto;align-items:flex-start}.cl-f .cell{width:100px!important;min-width:0;padding:6px 8px;font-size:.88rem}.cl-f select.cell{width:auto!important}select.cell{width:auto}.cl-a{margin-left:auto;padding-bottom:6px}.kmoney{font-size:1.5rem!important}.tot{gap:6px}.nb{display:inline-block;min-width:17px;padding:0 5px;border-radius:9px;background:#C0392B;color:#fff;font-size:.66rem;line-height:17px;text-align:center;font-weight:700;margin-left:2px}table.cot td{vertical-align:middle}

<script>
/* Alleviare · Datos para el certificado de defunción (lo llena la familia) */
const CFG = window.ALLEVIARE_CONFIG || {}; const URL0 = (CFG.supabaseUrl || "").replace(/\/$/, ""), KEY = CFG.supabaseAnonKey || "";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 3200); }
const D = { nombre: "", curp: "", sinCurp: false, afro: "", indigena: "", lengua: "", lenguaCual: "", fecha: "", hora: "", res: { calle: "", num: "", col: "", cp: "", mun: "", edo: "Jalisco" }, mismo: true, def: { calle: "", num: "", col: "", cp: "", mun: "", edo: "Jalisco" }, civil: "", escolaridad: "", ocupacion: "", seguridad: "", nss: "", inf: { nombre: "", parentesco: "", tel: "" }, cirugia: "", cirugiaCual: "", cirugiaFecha: "", dx: "", dxTiempo: "", dxUnidad: "años", otras: [{ enf: "", anios: "" }] };
const get = (o, p) => p.split(".").reduce((a, k) => a == null ? a : a[k], o);
const set = (o, p, v) => { const ks = p.split("."); let a = o; ks.slice(0, -1).forEach(k => a = a[k]); a[ks[ks.length - 1]] = v; };
const inp = (p, attrs = "") => `<input data-p="${p}" value="${esc(get(D, p))}" ${attrs}>`;
const F = (l, inner, cls = "", help = "") => `<label class="f ${cls}"><span>${esc(l)}</span>${inner}${help ? `<small class="muted" style="font-size:.78rem">${esc(help)}</small>` : ""}</label>`;
const chips = (p, opts) => `<div class="chips">${opts.map(o => `<button type="button" class="chip ${get(D, p) === o ? "on" : ""}" data-c="${p}" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
const sel = (p, opts) => `<select data-p="${p}"><option value="">Seleccionar…</option>${opts.map(o => `<option ${get(D, p) === o ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
const dom = (k, t) => `<div class="card stack"><div class="sec-t">${t}</div><div class="fieldgrid">${F("Calle", inp(k + ".calle"), "full")}${F("Número exterior e interior", inp(k + ".num"))}${F("Código postal", inp(k + ".cp", 'inputmode="numeric" maxlength="5"'))}${F("Colonia", inp(k + ".col"), "full")}${F("Municipio", inp(k + ".mun"))}${F("Estado", inp(k + ".edo"))}</div></div>`;
let paso = 0; const PASOS = 4;
const DOCS = [["ine", "INE de la persona que falleció"], ["dom", "Comprobante de domicilio (luz, agua, teléfono o predial)"], ["curp", "CURP de la persona que falleció"], ["acta", "Acta de nacimiento de la persona que falleció"], ["ineInf", "INE del familiar que da la información"]];
const DOCOK = {};
function render() {
  const bar = paso === 0 ? "" : `<div class="pasos">${["Persona", "Domicilios", "Datos generales", "Salud"].map((t, j) => `<span class="${j + 1 < paso ? "done" : j + 1 === paso ? "on" : ""}"><b>${j + 1}</b>${t}</span>`).join("")}</div>`;
  let body = "";
  if (paso === 0) body = `<div class="card stack" style="font-size:1rem;line-height:1.6">
      <p style="margin:0">Querida familia:</p>
      <p style="margin:0">Sentimos mucho su pérdida. Acompañar a su ser querido en esta etapa fue un honor para nosotros, y sabemos que estos días son de mucho cansancio y tristeza.</p>
      <p style="margin:0">Para que la doctora pueda hacer el certificado de defunción sin que ustedes tengan que dar más vueltas, les pedimos llenar estos datos. No hay prisa: háganlo cuando puedan, con calma. Si algo no lo saben, déjenlo en blanco y lo vemos juntos por teléfono.</p>
      <p style="margin:0">Con cariño,<br><b>El equipo de Alleviare</b></p></div>
    <div class="card stack"><div class="sec-t">Antes de empezar, tenga a la mano</div>
      <p class="small muted" style="margin:0">Los datos del certificado deben ser exactamente iguales a los de estos documentos. Un error en el nombre, la fecha o la CURP obliga a corregir el certificado después. Marque cada uno cuando ya lo tenga.</p>
      ${DOCS.map(([k, t]) => `<label style="display:flex;flex-wrap:nowrap;align-items:flex-start;gap:10px;padding:6px 0;cursor:pointer"><input type="checkbox" data-doc="${k}" ${DOCOK[k] ? "checked" : ""} style="width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--accent)"><span style="flex:1;min-width:0">${esc(t)}</span></label>`).join("")}
      <div class="alert small" style="margin:0"><b>También envíe estos documentos a su doctora</b> por WhatsApp al 311 204 8763. Pueden ser fotos tomadas con el celular o escaneos, siempre que se lean bien.</div></div>`;
  else if (paso === 1) body = `<h2>Datos de la persona que falleció</h2>
    <div class="card stack"><div class="fieldgrid">${F("Nombre completo", inp("nombre", 'autocomplete="off" placeholder="Nombre(s) y apellidos, como en su acta de nacimiento"'), "full")}
      ${F("CURP", inp("curp", 'maxlength="18" style="text-transform:uppercase" placeholder="18 letras y números"'), "full", "La encuentra en su INE, acta de nacimiento o en gob.mx/curp")}</div>
      <label class="row small"><input type="checkbox" data-p="sinCurp" ${D.sinCurp ? "checked" : ""}> No la tengo a la mano</label></div>
    <div class="card stack">${F("¿Se reconocía como afromexicano(a), negro(a) o afrodescendiente?", chips("afro", ["Sí", "No", "No sé"]), "full")}
      ${F("¿Se consideraba indígena?", chips("indigena", ["Sí", "No", "No sé"]), "full")}
      ${F("¿Hablaba alguna lengua indígena?", chips("lengua", ["Sí", "No", "No sé"]), "full")}
      ${D.lengua === "Sí" ? F("¿Cuál lengua?", inp("lenguaCual", 'placeholder="Ej. náhuatl, wixárika, purépecha"')) : ""}</div>
    <div class="card stack"><div class="fieldgrid">${F("Fecha en que falleció", inp("fecha", 'type="date"'))}${F("Hora aproximada", inp("hora", 'type="time"'))}</div></div>`;
  else if (paso === 2) body = `<h2>Domicilios</h2>${dom("res", "Domicilio donde vivía")}
    <div class="card"><label class="row"><input type="checkbox" data-p="mismo" ${D.mismo ? "checked" : ""}> Falleció en el mismo domicilio donde vivía</label></div>
    ${D.mismo ? "" : dom("def", "Domicilio donde falleció")}`;
  else if (paso === 3) body = `<h2>Datos generales</h2><div class="card stack"><div class="fieldgrid">
      ${F("Estado civil", sel("civil", ["Soltero(a)", "Casado(a)", "Unión libre", "Separado(a)", "Divorciado(a)", "Viudo(a)", "No sé"]))}
      ${F("Último grado de estudios", sel("escolaridad", ["Ninguno", "Preescolar", "Primaria incompleta", "Primaria completa", "Secundaria incompleta", "Secundaria completa", "Preparatoria o bachillerato incompleto", "Preparatoria o bachillerato completo", "Licenciatura o profesional", "Posgrado", "No sé"]))}
      ${F("¿A qué se dedicaba la mayor parte de su vida?", inp("ocupacion", 'placeholder="Ej. hogar, comerciante, maestra, jubilado de…"'), "full")}
      ${F("Servicio médico (seguridad social)", sel("seguridad", ["Ninguno", "IMSS", "ISSSTE", "IMSS-Bienestar", "Pemex, Sedena o Semar", "Seguro privado", "Otro", "No sé"]), "full")}
      ${D.seguridad === "IMSS" || D.seguridad === "ISSSTE" ? F("Número de seguridad social (NSS)", inp("nss", 'inputmode="numeric" maxlength="11" placeholder="11 dígitos"'), "full", "Viene en su credencial, carnet o en la app del " + D.seguridad) : ""}</div></div>
    <div class="card stack"><div class="sec-t">¿Quién da la información?</div><div class="fieldgrid">${F("Su nombre completo", inp("inf.nombre", 'autocomplete="name"'), "full")}${F("Parentesco con quien falleció", inp("inf.parentesco", 'placeholder="Hija, esposo, sobrina…"'))}${F("Su teléfono", inp("inf.tel", 'type="tel" inputmode="tel" placeholder="10 dígitos"'))}</div></div>`;
  else body = `<h2>Salud</h2>
    <div class="card stack">${F("¿Le hicieron alguna cirugía en las últimas 4 semanas?", chips("cirugia", ["Sí", "No", "No sé"]), "full")}
      ${D.cirugia === "Sí" ? `<div class="fieldgrid">${F("¿Qué cirugía?", inp("cirugiaCual"), "full")}${F("Fecha aproximada", inp("cirugiaFecha", 'type="date"'))}</div>` : ""}</div>
    <div class="card stack"><div class="sec-t">Enfermedad principal</div>
      <p class="small muted">Es la enfermedad más grave que tenía y que lo(la) llevó a necesitar cuidados. En la mayoría de los casos es un tipo de cáncer, por ejemplo: cáncer de estómago, cáncer de mama, cáncer de pulmón con metástasis.</p>
      <div class="fieldgrid">${F("¿Cuál era?", inp("dx", 'placeholder="Ej. cáncer de páncreas"'), "full")}${F("¿Hace cuánto se la diagnosticaron?", inp("dxTiempo", 'type="number" min="0" inputmode="numeric"'))}${F("Tiempo en", sel("dxUnidad", ["días", "semanas", "meses", "años"]))}</div></div>
    <div class="card stack"><div class="sec-t">Otras enfermedades importantes</div><p class="small muted">Por ejemplo: diabetes, presión alta, problemas del corazón o del riñón, EPOC. Escriba cuántos años tenía con cada una.</p>
